# 繁體中文語言包

# 系統訊息
system:
  welcome: "歡迎使用 Insights Bot！我可以幫助你回顧和總結聊天記錄。"
  cancel: "目前沒有正在進行的操作"
  # Go v1.0.0 只提供 en / zh-CN 語言包；其 BCP 47 matcher 會把所有 zh-*
  # 使用者（含 zh-TW/zh-HK）解析到 zh-CN，所以缺繁體譯文的 key 一律沿用
  # Go 對這些使用者實際輸出的簡體文本，不自創繁體譯文
  # （pkg/bots/tgbot/help_command.go:44-101，對照
  # system.commands.groups.basic.* 結構）。聊天回顧指令組的組名與各指令說明
  # 是 Go 源碼裡的字面量，不經過 i18n（見 system.rs 的 RECAP_GROUP），因此
  # 不受此政策影響，永遠顯示簡體中文。
  commands:
    groups:
      basic:
        name: "基础命令"
        commands:
          help:
            help: "获取帮助"
            message: |
              你好！👋 欢迎使用 Insights Bot！

              我当前支持这些命令：

              {Commands}
          cancel:
            help: "取消当前操作"
          start:
            help: "开始与 Bot 的交互"

# 回顧相關訊息
recap:
  processing: "正在生成回顧..."
  processing_hours: "⏳ 正在為過去 {hours} 小時的聊天記錄生成回顧，請稍等..."
  failed: "回顧生成失敗，請稍後再試。"
  fetch_failed: "獲取聊天記錄失敗，請稍後再試。"
  group_only: "此指令僅在群組中可用。"
  disabled: "此群組的回顧功能目前已關閉，請先使用 /configure_recap 啟用。"
  no_messages: "沒有可用的訊息進行回顧。"
  min_messages: "過去 {hours} 小時內只有 {count} 條文字訊息，至少需要 5 條才能生成回顧。"
  rate_limited: "請求過於頻繁，請稍後再試。"
  select_time_range: "📊 請選擇要回顧的時間範圍："
  hours_label: "{hours} 小時"
  hour_label: "1 小時"
  page_title: "【群組 {group}】用戶 {user} 發起 {hours} 小時總結"
  auto_page_title: "【群組 {chat}】自動回顧"
  published: "📝 <b>聊天回顧已發布到 Telegraph</b>: <a href=\"{url}\">{title}</a>\n\n<b>濃縮總結：</b>\n{condensed}\n\n#recap\n{footer}"
  no_telegraph: "📊 過去 {hours} 小時的聊天回顧（Telegraph 不可用）\n\n<b>濃縮總結：</b>\n{condensed}\n\n<b>分段總結：</b>\n{segmented}\n\n#recap\n{footer}"
  auto_published: "📝 <b>聊天回顧已發布到 Telegraph</b>: <a href=\"{url}\">{title}</a>\n\n<b>濃縮總結：</b>\n{condensed}\n\n#recap #recap_auto\n<i>群組：{group}</i>\n{footer}"
  auto_no_telegraph: "📊 自動聊天回顧（Telegraph 失敗）\n\n<b>濃縮：</b>\n{condensed}\n\n<b>分段：</b>\n{segmented}\n\n#recap #recap_auto\n<i>群組：{group}</i>\n{footer}"

# 配置訊息
config:
  group_only: "此指令僅在群組中可用。"
  load_failed: "載入設定失敗，請稍後再試。"
  updated: "✅ 設定完成。"
  header: "請在下方點擊想配置的選項進行操作。"
  section_enabled: "🔗 聊天記錄回顧"
  section_auto: "🔄 自動回顧"
  section_freq: "🔔 每天自動建立回顧次數"
  section_pin: "📌 置頂聊天記錄回顧"
  on: "開啟"
  off: "關閉"
  freq_2x: "2 次"
  freq_3x: "3 次"
  freq_4x: "4 次"
  done: "完成"

# Telegraph 相關
telegraph:
  note_split: "注意：由於內容較長，已自動分割為多個頁面。"
  continuation: "這是分割內容的續頁。"
  end_of_series: "系列頁面結束"
  series_pages: "系列頁面"
  part: "第 {n} 部分"
  model_condensed: "🤖️ 由 {model} 生成 濃縮總結"
  model_segmented: "🤖️ 由 {model} 生成 分段總結"
  model_check: "🤖️ 校驗格式：{status}"

# 模型狀態頁腳
footer:
  condensed: "🤖️ 由 {model} 生成 濃縮總結"
  segmented: "🤖️ 由 {model} 生成 分段總結"
  check_not_configured: "🤖️ 未配置校驗模型"
  check_not_triggered: "🤖️ 由 {model} 校驗格式未觸發"
  check_success: "🤖️ 由 {model} 校驗格式"
  check_failed: "🤖️ 由 {model} 校驗格式失敗"
  check_backup_success: "🤖️ 由 {model} 校驗格式失敗（備用 {backup_model} 成功）"
  check_backup_failed: "🤖️ 由 {model} 校驗格式失敗（備用 {backup_model} 失敗）"

# 結構化輸出標籤（用於 AI 輸出解析和生成）
labels:
  participants: "參與人"
  discussion: "討論"
  conclusion: "結論"
  colon: "："
  comma: "，"

# OpenAI 相關
openai:
  summary_failed: "摘要生成失敗"
  segmented_failed: "分段總結生成失敗"
  no_topics: "沒有識別到討論話題。"

# AI 提示詞（給大語言模型的指令）
prompts:
  sarcastic_system: "你是一位精煉的聊天記錄總結員。\n請將提供的聊天記錄，用繁體中文總結成一句話的核心內容，並在總結中恰當使用1-2個相關的emoji。\n總結應語言精煉、直擊要點。\n請直接給出總結，不要包含任何前言或解釋。"
  sarcastic_user: "以下是一段聊天記錄，請給出你的總結：\n\n聊天記錄：\"\"\"\n{chat_history}\n\"\"\"\n\n請直接給出總結，不要加任何解釋。"
  bullet_system: "你是一位精煉的聊天記錄總結員。請將提供的聊天記錄總結成要點，包含關鍵話題、決策和行動項目。\n\n要求：\n- 使用繁體中文回覆\n- 最多10個要點\n- 每個要點簡潔明瞭\n- 保留重要的用戶名和上下文\n- 每個要點末尾用方括號引用相關 msgId 編號，例如 [633577] 或 [633577][633579]；msgId 已在輸入中標記（格式 msgId:123: ...），可引用多個以覆蓋證據。"

# 群組遷移通知：Go v1.0.0 沒有繁體語言包，其 matcher 會把 zh-* 使用者解析到
# zh-CN，故沿用 Go 實際輸出的簡體文本，不自創繁體譯文（chatmigrate.go:148-166）
migration:
  notification: "{Name} @{Username} 监测到您的群组已从 <b>群组（group）</b> 升级为了 <b>超级群组（supergroup）</b>，届时，群组的 ID 将会发生变更，<b>现已自动将过去的历史记录和数据留存自动迁移到了新的群组 ID 名下</b>，之前的设置将会保留并继续沿用，不过需要注意的是，由于 Telegram 官方的限制，迁移事件前的消息 ID 将无法与今后发送的消息 ID 相兼容，所以当下一次总结消息时将不会包含在迁移事件发生前所发送的消息，由此带来的不便敬请谅解。"

# Bot 加入群組歡迎訊息：Go v1.0.0 沒有繁體語言包，其 matcher 會把 zh-*
# 使用者解析到 zh-CN，故沿用 Go 實際輸出的簡體文本，不自創繁體譯文
# （welcome.go:137-184，對應 modules.telegram.welcome.messageNormalGroup）
welcome:
  message_normal_group: |
    🤗 欢迎使用 @{Username}！

    - 如果要让我帮忙阅读网页文章，请直接使用开箱即用的命令 /smr@{Username} <code>要阅读的链接</code>；

    - 如果想要我帮忙总结本群组的聊天记录，请以<b>管理员</b>身份将我配置为本群组的管理员（可以关闭所有权限），然后在<b>非匿名和非其他身份的身份</b>下（推荐，否则容易出现权限识别错误的情况）发送 /configure_recap@{Username} 来开始配置本群组的聊天回顾功能。

    - 如果你在授权 Bot 管理员之后希望 Bot 将已经记录的消息全数移除，可以通过撤销 Bot 的管理员权限来触发 Bot 的历史数据自动清理（如果该部分代码未经其他 Bot 实例维护者修改的话）。

    ⚠️ 警告：你的群组尚未是超级群组（supergroup）。<b>普通群组的消息链接引用功能无法正常工作。</b>

    如果你希望使用消息链接引用功能，请通过下面任意操作使其正常运作：

    - 短时间内将群组开放为公共群组并快速还原回私有群组；
    - 通过其他操作将本群组升级为超级群组；

    如果还有疑问的话可以通过

    1. 执行帮助命令 /help@{Username} 来查看支持的命令；
    2. 前往 Bot 所在的<a href="https://github.com/nekomeowww/insights-bot">开源仓库</a>提交 Issue 问询开发者。

    祝你使用愉快！
