# 简体中文语言包

# 系统消息
system:
  welcome: "欢迎使用 Insights Bot！我可以帮助你回顾和总结聊天记录。"
  help: |
    可用命令：
    /start - 显示欢迎消息
    /help - 显示帮助
    /cancel - 取消当前操作
    /recap - 生成聊天回顾
    /configure_recap - 配置回顾设置
    /recap_forwarded_start - 使 Bot 接收在私聊中转发给 Bot 的消息，并在发送 /recap_forwarded 后开始总结
    /recap_forwarded - 使 Bot 停止接收在私聊中转发给 Bot 的消息，对已经转发过的消息进行总结
    /subscribe_recap - 订阅定时聊天回顾
    /unsubscribe_recap - 取消订阅定时聊天回顾
  cancel: "已经没有正在进行的操作了"

# 回顾相关消息
recap:
  processing: "正在生成回顾..."
  processing_hours: "⏳ 正在为过去 {hours} 小时的聊天记录生成回顾，请稍等..."
  failed: "回顾生成失败，请稍后再试。"
  fetch_failed: "获取聊天记录失败，请稍后再试。"
  group_only: "此命令仅在群组中可用。"
  disabled: "此群组的回顾功能目前已关闭，请先使用 /configure_recap 启用。"
  no_messages: "没有可用的消息进行回顾。"
  min_messages: "过去 {hours} 小时内只有 {count} 条文字消息，至少需要 5 条才能生成回顾。"
  rate_limited: "请求过于频繁，请稍后再试。"
  select_time_range: "📊 请选择要回顾的时间范围："
  hours_label: "{hours} 小时"
  hour_label: "1 小时"
  page_title: "【群组 {group}】用户 {user} 发起 {hours} 小时总结"
  auto_page_title: "【群组 {chat}】自动回顾"
  published: "📝 <b>聊天回顾已发布到 Telegraph</b>: <a href=\"{url}\">{title}</a>\n\n<b>浓缩总结：</b>\n{condensed}\n\n#recap\n{footer}"
  no_telegraph: "📊 过去 {hours} 小时的聊天回顾（Telegraph 不可用）\n\n<b>浓缩总结：</b>\n{condensed}\n\n<b>分段总结：</b>\n{segmented}\n\n#recap\n{footer}"
  auto_published: "📝 <b>聊天回顾已发布到 Telegraph</b>: <a href=\"{url}\">{title}</a>\n\n<b>浓缩总结：</b>\n{condensed}\n\n#recap #recap_auto\n<i>群组：{group}</i>\n{footer}"
  auto_no_telegraph: "📊 自动聊天回顾（Telegraph 失败）\n\n<b>浓缩：</b>\n{condensed}\n\n<b>分段：</b>\n{segmented}\n\n#recap #recap_auto\n<i>群组：{group}</i>\n{footer}"

# 配置消息
config:
  group_only: "此命令仅在群组中可用。"
  load_failed: "加载设置失败，请稍后再试。"
  updated: "✅ 设置完成。"
  header: "请在下面点击想配置的选项进行操作。"
  section_enabled: "🔗 聊天记录回顾"
  section_auto: "🔄 自动回顾"
  section_freq: "🔔 每天自动创建回顾次数"
  section_pin: "📌 置顶聊天记录回顾"
  on: "开启"
  off: "关闭"
  freq_2x: "2 次"
  freq_3x: "3 次"
  freq_4x: "4 次"
  done: "完成"

# Telegraph 相关
telegraph:
  note_split: "注意：由于内容较长，已自动分割为多个页面。"
  continuation: "这是分割内容的续页。"
  end_of_series: "系列页面结束"
  series_pages: "系列页面"
  part: "第 {n} 部分"
  model_condensed: "🤖️ 由 {model} 生成 浓缩总结"
  model_segmented: "🤖️ 由 {model} 生成 分段总结"
  model_check: "🤖️ 校验格式：{status}"

# 模型状态页脚
footer:
  condensed: "🤖️ 由 {model} 生成 浓缩总结"
  segmented: "🤖️ 由 {model} 生成 分段总结"
  check_not_configured: "🤖️ 未配置校验模型"
  check_not_triggered: "🤖️ 由 {model} 校验格式未触发"
  check_success: "🤖️ 由 {model} 校验格式"
  check_failed: "🤖️ 由 {model} 校验格式失败"
  check_backup_success: "🤖️ 由 {model} 校验格式失败（备用 {backup_model} 成功）"
  check_backup_failed: "🤖️ 由 {model} 校验格式失败（备用 {backup_model} 失败）"

# 结构化输出标签（用于 AI 输出解析和生成）
labels:
  participants: "参与人"
  discussion: "讨论"
  conclusion: "结论"
  colon: "："
  comma: "，"

# OpenAI 相关
openai:
  summary_failed: "摘要生成失败"
  segmented_failed: "分段总结生成失败"
  no_topics: "没有识别到讨论话题。"

# AI 提示词（给大语言模型的指令）
prompts:
  sarcastic_system: "你是一位精炼的聊天记录总结员。\n请将提供的聊天记录，用简体中文总结成一句话的核心内容，并在总结中恰当使用1-2个相关的emoji。\n总结应语言精练、直击要点。\n请直接给出总结，不要包含任何前言或解释。"
  sarcastic_user: "以下是一段聊天记录，请给出你的总结：\n\n聊天记录：\"\"\"\n{chat_history}\n\"\"\"\n\n请直接给出总结，不要加任何解释。"
  bullet_system: "你是一位精炼的聊天记录总结员。请将提供的聊天记录总结成要点，包含关键话题、决策和行动项目。\n\n要求：\n- 使用简体中文回复\n- 最多10个要点\n- 每个要点简洁明了\n- 保留重要的用户名和上下文\n- 每个要点末尾用方括号引用相关 msgId 编号，例如 [633577] 或 [633577][633579]；msgId 已在输入中标记（格式 msgId:123: ...），可引用多个以覆盖证据。"

# 群组迁移通知（对照 Go v1.0.0 chatmigrate.go:148-166）
migration:
  notification: "{Name} @{Username} 监测到您的群组已从 <b>群组（group）</b> 升级为了 <b>超级群组（supergroup）</b>，届时，群组的 ID 将会发生变更，<b>现已自动将过去的历史记录和数据留存自动迁移到了新的群组 ID 名下</b>，之前的设置将会保留并继续沿用，不过需要注意的是，由于 Telegram 官方的限制，迁移事件前的消息 ID 将无法与今后发送的消息 ID 相兼容，所以当下一次总结消息时将不会包含在迁移事件发生前所发送的消息，由此带来的不便敬请谅解。"

# Bot 加入群组欢迎消息（对照 Go v1.0.0 welcome.go:137-184，对应
# modules.telegram.welcome.messageNormalGroup）
welcome:
  message_normal_group: |
    🤗 欢迎使用 @{Username}！

    - 如果要让我帮忙阅读网页文章，请直接使用开箱即用的命令 /smr@{Username} <code>要阅读的链接</code>；

    - 如果想要我帮忙总结本群组的聊天记录，请以<b>管理员</b>身份将我配置为本群组的管理员（可以关闭所有权限），然后在<b>非匿名和非其他身份的身份</b>下（推荐，否则容易出现权限识别错误的情况）发送 /configure_recap@{Username} 来开始配置本群组的聊天回顾功能。

    - 如果你在授权 Bot 管理员之后希望 Bot 将已经记录的消息全数移除，可以通过撤销 Bot 的管理员权限来触发 Bot 的历史数据自动清理（如果该部分代码未经其他 Bot 实例维护者修改的话）。

    ⚠️ 警告：你的群组尚未是超级群组（supergroup）。<b>普通群组的消息链接引用功能无法正常工作。</b>

    如果你希望使用消息链接引用功能，请通过下面任意操作使其正常运作：

    - 短时间内将群组开放为公共群组并快速还原回私有群组；
    - 通过其他操作将本群组升级为超级群组；

    如果还有疑问的话可以通过

    1. 执行帮助命令 /help@{Username} 来查看支持的命令；
    2. 前往 Bot 所在的<a href="https://github.com/nekomeowww/insights-bot">开源仓库</a>提交 Issue 问询开发者。

    祝你使用愉快！
